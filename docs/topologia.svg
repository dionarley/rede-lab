<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="960" height="680" fill="#f8fafc"/>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">Rede Lab — Topologia</text>

  <rect x="30" y="60" width="900" height="580" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="50" y="90" font-size="14" font-weight="bold" fill="#64748b">HOST — Podman/Docker</text>

  <text x="480" y="128" text-anchor="middle" font-size="14" fill="#475569">Rede bridge lab-net — 10.0.0.0/24</text>

  <!-- Links da rede -->
  <line x1="215" y1="360" x2="440" y2="240" stroke="#64748b" stroke-width="2" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
  <line x1="750" y1="360" x2="520" y2="240" stroke="#64748b" stroke-width="2" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>

  <!-- ISP -->
  <rect x="390" y="150" width="180" height="90" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="480" y="180" text-anchor="middle" font-size="18" font-weight="bold" fill="#0c4a6e">ISP / Gateway</text>
  <text x="480" y="202" text-anchor="middle" font-size="14" fill="#0c4a6e">10.0.0.1/24</text>
  <text x="480" y="222" text-anchor="middle" font-size="12" fill="#0369a1">NAT + IP forwarding</text>

  <!-- CASA -->
  <rect x="80" y="360" width="270" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="215" y="392" text-anchor="middle" font-size="18" font-weight="bold" fill="#14532d">CASA</text>
  <text x="215" y="414" text-anchor="middle" font-size="13" fill="#166534">PC de Casa (cliente)</text>
  <text x="215" y="440" text-anchor="middle" font-size="14" fill="#14532d">10.0.0.10/24</text>
  <text x="215" y="464" text-anchor="middle" font-size="13" fill="#166534">wg1: 10.0.99.10</text>

  <!-- SERVIDOR -->
  <rect x="610" y="360" width="280" height="150" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="750" y="392" text-anchor="middle" font-size="18" font-weight="bold" fill="#78350f">SERVIDOR</text>
  <text x="750" y="414" text-anchor="middle" font-size="14" fill="#78350f">10.0.0.20/24</text>
  <text x="750" y="438" text-anchor="middle" font-size="13" fill="#92400e">sshd :22/tcp</text>
  <text x="750" y="462" text-anchor="middle" font-size="13" fill="#92400e">wg0: 10.0.99.1 :51820/udp</text>

  <!-- SSH sobre o túnel -->
  <line x1="350" y1="435" x2="610" y2="435" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7 5" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/>
  <text x="480" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">SSH — labuser@10.0.99.1:22</text>

  <!-- Túnel WireGuard -->
  <path d="M 350 480 C 440 550, 520 550, 610 480" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <text x="480" y="560" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">WireGuard — UDP 51820</text>
  <text x="480" y="578" text-anchor="middle" font-size="12" fill="#1e40af">túnel 10.0.99.0/24</text>

  <!-- Legenda -->
  <line x1="70" y1="615" x2="110" y2="615" stroke="#64748b" stroke-width="2"/>
  <text x="118" y="619" font-size="12" fill="#475569">rede 10.0.0.0/24</text>

  <line x1="290" y1="615" x2="330" y2="615" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="338" y="619" font-size="12" fill="#475569">túnel WireGuard</text>

  <line x1="500" y1="615" x2="540" y2="615" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="548" y="619" font-size="12" fill="#475569">sessão SSH</text>
</svg>
